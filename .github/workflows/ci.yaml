name: Unit Tests CI

on:
  push:
    branches:
      - test
  pull_request:
    branches:
      - main

jobs:
  job-1:
    name: Unit Test CI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        pip install uv
        uv sync

    - name: Run tests
      run: |
        uv run pytest